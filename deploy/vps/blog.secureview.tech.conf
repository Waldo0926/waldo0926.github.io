# nginx site for blog.secureview.tech. Files come from the `site` branch (see sync.sh).
# HTTPS is added by certbot: certbot --nginx -d blog.secureview.tech
server {
    listen 80;
    listen [::]:80;
    server_name blog.secureview.tech;

    root /opt/blog/site;
    index index.html;
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=86400";
    }

    location ^~ /.git { deny all; }

}
